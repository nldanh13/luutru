<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lưu trú bệnh viện</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e8c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lưu trú BV">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: app shell. Home = patient list with search; Patient view = patient info + relatives; actions in bottom bar; editors as bottom sheets */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#142030; --muted:#5d6879; --line:#dde2e9;
  --brand:#1f4e8c; --brand-ink:#ffffff; --brand-soft:#e4ecf7;
  --seal:#b3261e; --seal-soft:#fbe9e7; --ok:#1d7a46; --ok-soft:#e2f2e9; --warn:#8a5a00; --warn-soft:#fbefd4;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e141d; --surface:#17202c; --ink:#e7ecf3; --muted:#98a4b5; --line:#283444;
  --brand:#6f9fe0; --brand-ink:#0a1320; --brand-soft:#1c2b42;
  --seal:#f08a80; --seal-soft:#3a1f1d; --ok:#6fcf97; --ok-soft:#163224; --warn:#f0c060; --warn-soft:#382d13; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:4;background:var(--brand);color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:6px;min-height:56px}
.top h1{font-size:1.08rem;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.icon-btn{background:transparent;border:0;color:inherit;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:active{background:rgba(127,127,127,.2)}
.icon-btn svg{width:22px;height:22px}
main{padding:10px max(12px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto}
.search{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;border:0;border-top:1px solid var(--line);background:transparent;width:100%;text-align:left;cursor:pointer}
.item:first-child{border-top:0}
.item:active{background:var(--brand-soft)}
.item.p3{grid-template-columns:auto minmax(0,1fr) auto}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.match{font-size:.78rem;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--brand-soft);color:var(--brand)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--seal-soft);color:var(--seal)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.gray{background:var(--bg);color:var(--muted)}
.role{font-size:.7rem;font-weight:800;border-radius:6px;padding:3px 6px;min-width:34px;text-align:center}
.role.BN{background:var(--seal-soft);color:var(--seal)} .role.NN{background:var(--brand-soft);color:var(--brand)}
.stack{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.fresh{animation:pop 1s ease-out}
@keyframes pop{from{background:var(--ok-soft)}to{background:transparent}}
.empty{text-align:center;color:var(--muted);padding:40px 20px;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty b{color:var(--ink);font-size:1.05rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.sec{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 2px 6px;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.74rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=tel],input[type=number],select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 9px;width:100%;min-width:0}
.btn{border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--seal)}
.btn.ghost{background:transparent}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1 1 140px}
.raw{font-size:.78rem;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px;margin-top:10px;overflow-wrap:anywhere}
.hint{font-size:.8rem;color:var(--warn);margin-top:6px}
.hint.bad{color:var(--seal)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;color:var(--muted);margin-top:10px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.88rem;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.err{background:var(--seal);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:8px max(14px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.bar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.side{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);background:none;border:0;cursor:pointer;padding:6px;position:relative}
.side svg{width:24px;height:24px;color:var(--ink)}
.side input{position:absolute;inset:0;opacity:0;cursor:pointer}
.fab{height:60px;min-width:60px;border-radius:30px;border:0;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;cursor:pointer;box-shadow:0 4px 14px rgba(31,78,140,.35);margin-top:-24px;font-weight:700}
.fab svg{width:26px;height:26px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:6px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 8px}
.sheet h2{font-size:1.05rem;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
/* camera */
.cam{position:fixed;inset:0;z-index:40;background:#000;overflow:hidden;touch-action:none}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.aim{position:absolute;left:50%;top:44%;width:min(70vw,50vh,360px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
.aim::before{content:"";position:absolute;inset:0;border:3px solid rgba(255,255,255,.9);border-radius:18px}
.aim.hit::before{border-color:#4ee08a}
.aim.hit{box-shadow:0 0 0 100vmax rgba(20,90,50,.55)}
.ctop{position:absolute;top:0;left:0;right:0;display:flex;flex-direction:column;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;color:#fff}
.crow{display:flex;align-items:center;gap:6px}
.crow .grow{flex:1;text-align:center;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctop .icon-btn{background:rgba(0,0,0,.35)}
.ctop .icon-btn.on{background:#f5c542;color:#000}
.camrole{display:flex;justify-content:center;gap:6px}
.camrole button{background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
.camrole button.on{background:#fff;color:#000}
.cmsg{position:absolute;left:0;right:0;top:calc(44% + min(35vw,25vh,180px) + 12px);text-align:center;color:#fff;font-weight:600;padding:0 16px;text-shadow:0 1px 3px #000}
.cbot{position:absolute;left:0;right:0;bottom:0;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:center}
.recent{display:flex;flex-direction:column;gap:4px;width:100%;max-width:420px}
.recent div{background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:6px 10px;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done{background:#fff;color:#000;border:0;border-radius:999px;padding:12px 34px;font-weight:700;font-size:1rem;cursor:pointer}
.zoom{display:flex;gap:6px}
.zoom button{background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 11px;font-size:.8rem;font-weight:700;cursor:pointer}
.zoom button.on{background:#fff;color:#000}
.auth{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.authbox{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:8px}
.authbox h1{margin:0;font-size:1.3rem;color:var(--brand)}
.authbox input[type=password]{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 9px;width:100%}
.sync{width:10px;height:10px;border-radius:50%;background:#7be3a4;flex:none}
.sync[data-st="pend"]{background:#f5c542}
.sync[data-st="off"]{background:#ff8a80}
.ulist{display:flex;flex-direction:column;gap:6px}
.urow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
</style>
</head><body>


<div id="auth" class="auth" hidden></div>
<div id="app" hidden>
<header class="top">
  <button class="icon-btn" id="backBtn" type="button" aria-label="Quay lại" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h1 id="title">Lưu trú bệnh viện</h1>
  <span class="sync" id="syncDot" data-st="ok" title="Đã đồng bộ"></span>
  <button class="icon-btn" id="setBtn" type="button" aria-label="Cài đặt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="7" cy="18" r="2" fill="currentColor"/></svg></button>
</header>

<main>
  <div id="loading" class="empty">Đang chuẩn bị danh mục…</div>
  <section id="home" hidden>
    <input class="search" id="q" type="search" placeholder="Tìm bệnh nhân, mã BA, người nhà, số CCCD…" aria-label="Tìm kiếm">
    <div class="chips" id="filters"></div>
    <div id="plist"></div>
  </section>
  <section id="pview" hidden></section>
</main>

<nav class="bar"><div class="in">
  <button class="side" id="exportBtn" type="button" aria-label="Xuất file Excel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13l4 4M13 13l-4 4"/></svg>
    <span id="exportLbl">Xuất file</span>
  </button>
  <button class="fab" id="fab" type="button"></button>
  <label class="side" id="pickWrap" aria-label="Đọc mã QR từ ảnh">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 8"/></svg>
    Từ ảnh
    <input id="pick" type="file" accept="image/*" multiple>
  </label>
</div></nav>
</div>

<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<div class="cam" id="cam" hidden role="dialog" aria-label="Quét bằng camera">
  <video id="video" playsinline muted autoplay></video>
  <div class="aim" id="aim"></div>
  <div class="ctop">
    <div class="crow">
      <button class="icon-btn" id="camX" type="button" aria-label="Đóng camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="grow" id="camTitle"></div>
      <button class="icon-btn" id="torch" type="button" aria-label="Đèn flash" hidden><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></button>
      <button class="icon-btn" id="flip" type="button" aria-label="Đổi camera" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3v12H4z"/><path d="M9 13a3 3 0 0 1 5-2.2M15 13a3 3 0 0 1-5 2.2"/></svg></button>
    </div>
    <div class="camrole" id="camRole"><button type="button" data-r="BN">Bệnh nhân</button><button type="button" data-r="NN">Người nhà</button></div>
  </div>
  <div class="cmsg" id="camMsg"></div>
  <div class="cbot">
    <div class="zoom" id="zoomBox" hidden></div>
    <div class="recent" id="recent"></div>
    <button class="done" id="camDone" type="button">Xong</button>
  </div>
</div>

<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog"></div></div>
<input id="restoreFile" type="file" accept="application/json,.json" hidden>

<script>
(function(){
"use strict";
const $ = (id) => document.getElementById(id);
const KEY = "luutru-bv-v3";

/* ---------- Danh mục (đọc từ file mẫu) ---------- */
const CAT = { docTypes:[], residence:[], reasons:[], genders:[], nations:[], provinces:[], wards:[] };
let templateBuf = null;

function colRow(ref){ const m = /^([A-Z]+)(\d+)$/.exec(ref); return [m[1], +m[2]]; }
function readShared(xml){
  const d = new DOMParser().parseFromString(xml, "application/xml");
  return [...d.getElementsByTagName("si")].map(si => [...si.getElementsByTagName("t")].map(t => t.textContent).join(""));
}
function readSheet(xml, ss){
  const d = new DOMParser().parseFromString(xml, "application/xml");
  const out = {};
  for (const c of d.getElementsByTagName("c")){
    const v = c.getElementsByTagName("v")[0];
    let val;
    if (c.getAttribute("t") === "s" && v) val = ss[+v.textContent];
    else if (c.getAttribute("t") === "inlineStr") val = [...c.getElementsByTagName("t")].map(t=>t.textContent).join("");
    else if (v) val = v.textContent;
    if (val != null && val !== "") out[c.getAttribute("r")] = String(val);
  }
  return out;
}
function col(sheet, letter, from, to){ const a=[]; for(let r=from;r<=to;r++){ const v=sheet[letter+r]; if(v) a.push(v.trim()); } return a; }

async function loadTemplate(buf){
  const zip = await JSZip.loadAsync(buf);
  const ss = readShared(await zip.file("xl/sharedStrings.xml").async("string"));
  const wb = await zip.file("xl/workbook.xml").async("string");
  const rels = await zip.file("xl/_rels/workbook.xml.rels").async("string");
  const relMap = {}; rels.replace(/<Relationship [^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g,(m,id,t)=>{relMap[id]=t;});
  rels.replace(/<Relationship [^>]*Target="([^"]+)"[^>]*Id="([^"]+)"/g,(m,t,id)=>{relMap[id]=t;});
  const sheets = {}; wb.replace(/<sheet [^>]*name="([^"]+)"[^>]*r:id="([^"]+)"/g,(m,n,id)=>{sheets[n]="xl/"+relMap[id].replace(/^\/?xl\//,"");});
  const get = async (n) => readSheet(await zip.file(sheets[n]).async("string"), ss);
  const dm = await get("DANH_MUC"), tt = await get("TINH_THANH"), px = await get("PHUONG_XA");
  CAT.docTypes = col(dm,"A",2,40); CAT.residence = col(dm,"B",2,10); CAT.reasons = col(dm,"C",2,60);
  CAT.genders = col(dm,"D",2,5); CAT.nations = col(dm,"E",2,400);
  CAT.provinces = []; for(let r=2;r<200;r++){ if(!tt["C"+r]) continue; CAT.provinces.push({code:tt["A"+r].trim(), name:tt["B"+r].trim(), display:tt["C"+r].trim()}); }
  CAT.wards = []; for(let r=2;r<20000;r++){ if(!px["D"+r] || !px["C"+r]) continue; CAT.wards.push({code:px["A"+r].trim(), name:px["B"+r].trim(), prov:px["C"+r].trim(), display:px["D"+r].trim()}); }
  CAT.wardsByProv = {}; for (const w of CAT.wards){ (CAT.wardsByProv[w.prov] ||= []).push(w); }
  sheets._main = sheets["DS_KHACH_VIET_NAM_LUU_TRU"] || Object.values(sheets)[0];
  CAT.mainSheetPath = sheets._main;
  CAT.provinceSheet = true;
}

/* ---------- Chuẩn hóa tên ---------- */
function norm(s){
  return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[\u0111\u0110]/g,"d").toLowerCase()
    .replace(/[.\-\u2013_]/g," ").replace(/\s+/g," ").trim();
}
function stripProvPrefix(n){ return n.replace(/^(tinh|thanh pho|tp)\s+/,"").trim(); }
const PROV_ALIAS = {
  "ha giang":"tuyen quang","yen bai":"lao cai","bac kan":"thai nguyen","bac can":"thai nguyen","vinh phuc":"phu tho","hoa binh":"phu tho",
  "bac giang":"bac ninh","thai binh":"hung yen","hai duong":"hai phong","ha nam":"ninh binh","nam dinh":"ninh binh","quang binh":"quang tri",
  "quang nam":"da nang","kon tum":"quang ngai","binh dinh":"gia lai","ninh thuan":"khanh hoa","dak nong":"lam dong","dac nong":"lam dong",
  "binh thuan":"lam dong","phu yen":"dak lak","dac lac":"dak lak","binh duong":"ho chi minh","ba ria vung tau":"ho chi minh","vung tau":"ho chi minh",
  "binh phuoc":"dong nai","long an":"tay ninh","soc trang":"can tho","hau giang":"can tho","ben tre":"vinh long","tra vinh":"vinh long",
  "tien giang":"dong thap","bac lieu":"ca mau","kien giang":"an giang","thua thien hue":"hue","hcm":"ho chi minh","sai gon":"ho chi minh"
};
function findProvince(seg){
  let n = stripProvPrefix(norm(seg));
  n = PROV_ALIAS[n] || n;
  return CAT.provinces.find(p => stripProvPrefix(norm(p.name)) === n) || null;
}
function expandWard(n){
  return n.replace(/^p\s+(?=\S)/,"phuong ").replace(/^x\s+(?=\S)/,"xa ").replace(/^tt\s+(?=\S)/,"thi tran ");
}
const WARD_TYPE = /^(phuong|xa|thi tran|dac khu)\s+/;
const DISTRICT = /^(quan|huyen|thi xa|thanh pho|tp|q|h)\s+\S/;

/* Tách địa chỉ thường trú trên thẻ -> tỉnh, phường/xã, địa chỉ chi tiết */
function parseAddress(addr){
  const res = { prov:"", ward:"", detail:"", note:"" };
  const segs = (addr||"").split(",").map(s=>s.trim()).filter(Boolean);
  if (!segs.length) return res;
  let pi = -1, prov = null;
  for (let i = segs.length-1; i >= 0 && i >= segs.length-2; i--){ prov = findProvince(segs[i]); if (prov){ pi = i; break; } }
  if (!prov){ res.detail = segs.join(", "); res.note = "Chưa nhận ra tỉnh/thành, hãy chọn tay."; return res; }
  res.prov = prov.display;
  const before = segs.slice(0, pi);
  let oldFormat = false, end = before.length;
  if (end && DISTRICT.test(norm(before[end-1])) && !WARD_TYPE.test(norm(before[end-1]))){ oldFormat = true; end--; }
  const wards = CAT.wardsByProv[prov.code] || [];
  let wi = -1, ward = null;
  for (let i = end-1; i >= 0 && i >= end-2; i--){
    const n = expandWard(norm(before[i]));
    ward = wards.find(w => norm(w.name) === n);
    if (!ward){
      const bare = n.replace(WARD_TYPE,"");
      const hits = wards.filter(w => norm(w.name).replace(WARD_TYPE,"") === bare);
      if (hits.length === 1) ward = hits[0];
    }
    if (ward){ wi = i; break; }
  }
  const renamed = stripProvPrefix(norm(prov.name)) !== stripProvPrefix(norm(segs[pi]));
  if (ward){
    res.ward = ward.display;
    res.detail = before.slice(0, wi).join(", ");
    if (oldFormat || renamed) res.note = "Địa chỉ trên thẻ theo địa giới cũ. Phường/xã được gợi ý theo tên, hãy kiểm tra lại.";
  } else {
    res.detail = before.join(", ");
    res.note = (oldFormat || renamed) ? "Địa chỉ trên thẻ theo địa giới cũ, hãy chọn phường/xã mới." : "Chưa nhận ra phường/xã, hãy chọn tay.";
  }
  return res;
}

/* ---------- Đọc chuỗi QR căn cước ---------- */
function ddmmyyyy(s){ s=(s||"").replace(/\D/g,""); return s.length===8 ? s.slice(0,2)+"/"+s.slice(2,4)+"/"+s.slice(4) : ""; }
function parseQR(text){
  const p = (text||"").trim().split("|");
  if (p.length < 6) return null;
  const id = p[0].replace(/\D/g,"");
  if (!(id.length === 12 || id.length === 9)) return null;
  const name = (p[2]||"").trim();
  if (!name) return null;
  const issue = (p[6]||"").replace(/\D/g,"");
  let docType = "1 - Thẻ CCCD";
  if (id.length === 9) docType = "2 - Thẻ CMND";
  else if (issue.length === 8){ const ymd = +(issue.slice(4)+issue.slice(2,4)+issue.slice(0,2)); if (ymd >= 20240701) docType = "8 - Thẻ Căn Cước"; }
  const g = norm(p[4]);
  return { docNo:id, oldId:(p[1]||"").trim(), name, dob:ddmmyyyy(p[3]), gender: g.startsWith("nu") ? "F - Nữ" : (g.startsWith("nam") ? "M - Nam" : ""),
           rawAddr:(p[5]||"").trim(), issue:ddmmyyyy(p[6]), docType };
}

/* ---------- Giải mã QR từ ảnh ---------- */
let detector = null;
try { if ("BarcodeDetector" in window) detector = new BarcodeDetector({formats:["qr_code"]}); } catch(e){ detector = null; }

function loadImage(file){
  return new Promise((res, rej) => { const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { res(img); setTimeout(()=>URL.revokeObjectURL(url), 1000); }; img.onerror = () => rej(new Error("img")); img.src = url; });
}
function tryJsQR(img, sx, sy, sw, sh, maxDim){
  const scale = Math.min(1, maxDim / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw*scale)), h = Math.max(1, Math.round(sh*scale));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d", {willReadFrequently:true});
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  const d = ctx.getImageData(0,0,w,h);
  const r = jsQR(d.data, w, h, {inversionAttempts:"attemptBoth"});
  return r && r.data ? r.data : null;
}
async function decodeFile(file){
  const img = await loadImage(file);
  const W = img.naturalWidth, H = img.naturalHeight;
  if (detector){
    try { const codes = await detector.detect(img); const hit = codes.find(c => parseQR(c.rawValue)); if (hit) return hit.rawValue; if (codes[0]) return codes[0].rawValue; } catch(e){}
  }
  if (typeof jsQR !== "function") return null;
  for (const md of [1200, 1800, 800, 2600]){ const r = tryJsQR(img, 0, 0, W, H, md); if (r) return r; await new Promise(r=>setTimeout(r,0)); }
  const fr = [0.5, 0.65];
  for (const f of fr){
    const sw = W*f, sh = H*f;
    for (const [ox, oy] of [[1,0],[0,0],[1,1],[0,1],[.5,.5],[.5,0],[1,.5]]){
      const r = tryJsQR(img, (W-sw)*ox, (H-sh)*oy, sw, sh, 1400); if (r) return r;
      await new Promise(r=>setTimeout(r,0));
    }
  }
  return null;
}



/* ---------- Xuất Excel theo mẫu ---------- */
function xesc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,""); }
const COLS = "ABCDEFGHIJKLMNOPQRS".split("");
const LIST_COLS = new Set(["A","D","E","F","J","K","L","Q"]);
function rowValues(g, i){
  return [i+1, g.name.trim(), g.dob, g.gender, g.nat, g.docType, g.docType.startsWith("9 ") ? g.docName : "", g.docNo.trim(), g.phone.trim(),
    g.residence, g.prov, g.ward, g.detail.trim(), isoToVn(g.arrive), isoToVn(g.leave), g.room.trim(), g.reason,
    g.reason.startsWith("20 ") ? g.reasonText.trim() : "", g.note.trim()];
}
function buildSheetXml(xml, guests, keep){
  const start = keep ? 5 : 4;
  const rows = guests.map((g, i) => {
    const r = start + i, vals = rowValues(g, i);
    const cells = vals.map((v, c) => {
      const ref = COLS[c]+r, s = LIST_COLS.has(COLS[c]) ? 10 : 11;
      if (c === 0) return '<c r="'+ref+'" s="'+s+'"><v>'+v+'</v></c>';
      if (v === "" || v == null) return '<c r="'+ref+'" s="'+s+'"/>';
      return '<c r="'+ref+'" s="'+s+'" t="inlineStr"><is><t xml:space="preserve">'+xesc(v)+'</t></is></c>';
    }).join("");
    return '<row r="'+r+'" spans="1:19">'+cells+'</row>';
  }).join("");
  const cut = xml.indexOf('<row r="'+start+'"');
  const endIdx = xml.indexOf("</sheetData>");
  const head = cut >= 0 ? xml.slice(0, cut) : xml.slice(0, endIdx);
  let out = head + rows + xml.slice(endIdx);
  const last = Math.max(start-1, start + guests.length - 1);
  out = out.replace(/<dimension ref="[^"]*"\/>/, '<dimension ref="A1:S'+last+'"/>');
  return out;
}
async function buildWorkbook(){
  const zip = await JSZip.loadAsync(templateBuf);
  const path = CAT.mainSheetPath;
  const xml = await zip.file(path).async("string");
  zip.file(path, buildSheetXml(xml, state.guests, state.settings.keep));
  return zip.generateAsync({type:"blob", compression:"DEFLATE", mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

let nnnBuf = null, NNN_SHEET = "xl/worksheets/sheet2.xml";
async function loadNNN(buf){
  const zip = await JSZip.loadAsync(buf);
  const wb = await zip.file("xl/workbook.xml").async("string");
  const rels = await zip.file("xl/_rels/workbook.xml.rels").async("string");
  const m = /<sheet [^>]*name="KBTT"[^>]*r:id="([^"]+)"/.exec(wb);
  if (m){ const r = new RegExp('Id="'+m[1]+'"[^>]*Target="([^"]+)"|Target="([^"]+)"[^>]*Id="'+m[1]+'"').exec(rels); if (r) NNN_SHEET = "xl/" + (r[1]||r[2]).replace(/^\/?xl\//,""); }
}
function cellStr(ref, s, v){ return (v===""||v==null) ? '<c r="'+ref+'" s="'+s+'"/>' : '<c r="'+ref+'" s="'+s+'" t="inlineStr"><is><t xml:space="preserve">'+xesc(v)+'</t></is></c>'; }
async function buildNNN(list, keep){
  const zip = await JSZip.loadAsync(nnnBuf);
  let xml = await zip.file(NNN_SHEET).async("string");
  const start = keep ? 4 : 3;
  const C = "ABCDEFGHIJKL".split("");
  list.forEach((p, i) => {
    const r = start + i;
    const vals = [i+1, p.name.trim(), p.dob, p.dobType||"D - Ngày", p.gender, p.nat, p.passport.trim(), p.roomOut, isoToVn(p.arrive), isoToVn(p.leave), isoToVn(p.left), isoToVn(p.visaUntil)];
    const cells = vals.map((v,c) => c===0 ? '<c r="A'+r+'" s="8"><v>'+v+'</v></c>' : cellStr(C[c]+r, 5, v)).join("");
    const row = '<row r="'+r+'" spans="1:12">'+cells+'</row>';
    const re = new RegExp('<row r="'+r+'"[^>]*?(?:/>|>[\\s\\S]*?</row>)');
    if (re.test(xml)) xml = xml.replace(re, row);
    else xml = xml.replace("</sheetData>", row + "</sheetData>");
  });
  const last = start + list.length - 1;
  if (last > 653){
    xml = xml.replace(/<dimension ref="[^"]*"\/>/, '<dimension ref="A1:Q'+last+'"/>');
    const tp = "xl/tables/table1.xml"; const t = zip.file(tp);
    if (t){ let tx = await t.async("string"); tx = tx.replace(/ref="A2:L\d+"/g, 'ref="A2:L'+last+'"'); zip.file(tp, tx); }
  }
  zip.file(NNN_SHEET, xml);
  return zip.generateAsync({type:"blob", compression:"DEFLATE", mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

function missingOf(x){
  const m = [];
  if (!x.name.trim()) m.push("họ tên");
  if (!/^\d{2}\/\d{2}\/\d{4}$/.test(x.dob) && !(x.kind==="NNN" && /^\d{4}$|^\d{2}\/\d{4}$/.test(x.dob))) m.push("ngày sinh");
  if (!x.gender) m.push("giới tính");
  if (!x.nat) m.push("quốc tịch");
  if (x.kind === "VN"){
    if (!x.docType) m.push("loại giấy tờ");
    if (x.docType.startsWith("9 ") && !x.docName.trim()) m.push("tên giấy tờ");
    if (!x.docNo.trim()) m.push("số giấy tờ");
    if (!x.reason) m.push("lý do");
    if (x.reason.startsWith("20 ") && !x.reasonText.trim()) m.push("nhập lý do");
  } else {
    if (!x.passport.trim()) m.push("số hộ chiếu");
    if (!x.visaUntil) m.push("thời hạn tạm trú");
  }
  if (!x.arrive) m.push("ngày đến");
  if (!x.leave) m.push("ngày đi");
  if (x.arrive && x.leave && x.leave < x.arrive) m.push("ngày đi trước ngày đến");
  return m;
}
function sysState(x){

  if (st.out) return ["gray","Đã trả phòng"];
  if (st.outMsg) return ["bad","Lỗi trả phòng"];
  if (x.leave && st.leave && x.leave > st.leave && !x.left) return ["warn","Cần gia hạn"];
  return ["ok","Đã gửi"];
}

let camRole = "NN";
function addScan(text, role){
  const p = pat(curPid); if (!p) return {ok:false, msg:"Chưa chọn bệnh nhân"};
  const q = parseQR(text);
  if (!q) return {ok:false, msg:"Mã này không phải QR căn cước"};
  const dupHere = peopleOf(p.id).find(x => x.docNo === q.docNo);
  if (dupHere) return {ok:false, dup:true, msg:"Đã có: "+dupHere.name};
  const other = S.people.find(x => x.docNo === q.docNo && !x.left && x.pid !== p.id);
  const x = newPerson(p, role, "VN", q);
  if (role === "BN" && !p.name){ p.name = x.name; save(); }
  fresh = x.id; render();
  return {ok:true, x, warn: other ? "Lưu ý: người này cũng đang ở hồ sơ BN "+((pat(other.pid)||{}).name||"khác") : ""};
}
async function handleFiles(files){
  let ok=0, fail=0;
  for (const f of files){
    toast("Đang đọc ảnh "+(ok+fail+1)+"/"+files.length+"…");
    let t=null; try{ t=await decodeFile(f); }catch(e){}
    const p = pat(curPid); const role = p && peopleOf(p.id).some(y=>y.role==="BN") ? "NN" : "BN";
    const r = t ? addScan(t, role) : {ok:false}; r.ok ? ok++ : fail++;
  }
  toast(ok ? "Đã thêm "+ok+" người"+(fail?", "+fail+" ảnh không đọc được":"") : "Không đọc được mã QR. Chụp gần và rõ hơn.", !ok);
}

/* ---- camera ---- */
let stream=null, track=null, scanning=false, busy=false, lastTick=0, cooldownUntil=0, lastText="", backCams=[];
const recent = [];
const cvs = document.createElement("canvas"); const cctx = cvs.getContext("2d", {willReadFrequently:true});
function paintRole(){ [...$("camRole").children].forEach(b => b.classList.toggle("on", b.dataset.r === camRole)); $("camMsg").textContent = camRole==="BN" ? "Quét CCCD của bệnh nhân" : "Quét CCCD của người nhà"; }
$("camRole").onclick = e => { const b = e.target.closest("[data-r]"); if (b){ camRole = b.dataset.r; paintRole(); } };
function pickMainBack(list){
  const back = list.filter(d => /back|rear|environment|sau/i.test(d.label));
  const pool = back.length ? back : list;
  const main = pool.find(d => /\b0\b/.test(d.label) && !/wide|ultra|tele|macro/i.test(d.label)) || pool.find(d => !/wide|ultra|tele|macro|depth/i.test(d.label)) || pool[0];
  return { pool, main };
}
async function startStream(deviceId){
  const v = { width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30, max:30} };
  if (deviceId) v.deviceId = {exact:deviceId}; else v.facingMode = {ideal:"environment"};
  stream = await navigator.mediaDevices.getUserMedia({audio:false, video:v});
  track = stream.getVideoTracks()[0];
  const vid = $("video"); vid.srcObject = stream; try { await vid.play(); } catch(e){}
  try { await track.applyConstraints({advanced:[{focusMode:"continuous"}]}); } catch(e){}
  setupZoom();
  const caps = (track.getCapabilities && track.getCapabilities()) || {};
  $("torch").hidden = !caps.torch; $("torch").classList.remove("on");
}
function stopStream(){ if (stream) stream.getTracks().forEach(t=>t.stop()); stream=null; track=null; }
function setupZoom(){
  const box = $("zoomBox"); const caps = (track && track.getCapabilities && track.getCapabilities()) || {};
  if (!caps.zoom || caps.zoom.max < 1.4){ box.hidden = true; return; }
  const levels = [1, 1.5, 2, 3].filter(z => z >= caps.zoom.min && z <= caps.zoom.max);
  let cur = S.settings.zoom && levels.includes(S.settings.zoom) ? S.settings.zoom : (levels.includes(1.5) ? 1.5 : levels[0]);
  const paint = () => { box.innerHTML = levels.map(z => '<button type="button" class="'+(z===cur?'on':'')+'" data-z="'+z+'">'+z+'×</button>').join(""); };
  const apply = async (z) => { try { await track.applyConstraints({advanced:[{zoom:z}]}); cur=z; S.settings.zoom=z; save(); paint(); } catch(e){} };
  box.onclick = e => { const b=e.target.closest("[data-z]"); if (b) apply(+b.dataset.z); };
  paint(); apply(cur); box.hidden = false;
}
async function openCamera(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast("Máy này không mở được camera. Dùng nút “Từ ảnh”.", true); return; }
  const p = pat(curPid);
  $("cam").hidden = false; $("camTitle").textContent = p && p.name ? p.name : "Bệnh nhân mới"; recent.length = 0; $("recent").innerHTML = ""; paintRole();
  try { await startStream(S.settings.cam || null); }
  catch(e){ try { S.settings.cam=""; await startStream(null); } catch(e2){ $("cam").hidden = true; toast("Không mở được camera. Hãy cho phép quyền camera trong cài đặt trình duyệt.", true); return; } }
  try {
    const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
    const { pool, main } = pickMainBack(devs); backCams = pool; $("flip").hidden = pool.length < 2;
    const curId = track && track.getSettings ? track.getSettings().deviceId : "";
    if (!S.settings.cam && main && main.deviceId && main.deviceId !== curId){ stopStream(); await startStream(main.deviceId); }
    if (track && track.getSettings){ S.settings.cam = track.getSettings().deviceId || ""; save(); }
  } catch(e){}
  scanning = true; schedule();
}
function closeCamera(){ scanning = false; stopStream(); $("cam").hidden = true; render(); }
function schedule(){ if (!scanning) return; const v = $("video"); if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(tick); else requestAnimationFrame(tick); }
async function tick(){
  if (!scanning) return;
  const now = performance.now();
  if (busy || now - lastTick < 90 || now < cooldownUntil){ schedule(); return; }
  const v = $("video"); if (!v.videoWidth){ schedule(); return; }
  busy = true; lastTick = now;
  try {
    const vr = v.getBoundingClientRect(), ar = $("aim").getBoundingClientRect();
    const s = Math.max(vr.width / v.videoWidth, vr.height / v.videoHeight);
    const offX = (vr.width - v.videoWidth*s)/2, offY = (vr.height - v.videoHeight*s)/2;
    const pad = ar.width * 0.15;
    let sx = (ar.left - vr.left - offX - pad)/s, sy = (ar.top - vr.top - offY - pad)/s, sw = (ar.width + 2*pad)/s;
    sx = Math.max(0, sx); sy = Math.max(0, sy); sw = Math.min(sw, v.videoWidth - sx, v.videoHeight - sy);
    const out = Math.min(720, Math.round(sw));
    cvs.width = out; cvs.height = out;
    cctx.drawImage(v, sx, sy, sw, sw, 0, 0, out, out);
    let text = null;
    if (detector){ try { const c = await detector.detect(cvs); if (c[0]) text = c[0].rawValue; } catch(e){} }
    else if (typeof jsQR === "function"){ const r = jsQR(cctx.getImageData(0,0,out,out).data, out, out, {inversionAttempts:"dontInvert"}); if (r && r.data) text = r.data; }
    if (text) onScan(text);
  } finally { busy = false; schedule(); }
}
function onScan(text){
  if (text === lastText && performance.now() < cooldownUntil + 1500) return;
  lastText = text;
  const r = addScan(text, camRole);
  const aim = $("aim");
  if (r.ok){
    cooldownUntil = performance.now() + 900;
    aim.classList.add("hit"); setTimeout(()=>aim.classList.remove("hit"), 700);
    try { navigator.vibrate && navigator.vibrate(80); } catch(e){}
    beep();
    recent.unshift((camRole==="BN"?"BN · ":"Nhà · ")+r.x.name+" · "+r.x.docNo); recent.length = Math.min(recent.length, 3);
    $("recent").innerHTML = recent.map(t => '<div>'+esc(t)+'</div>').join("");
    const p = pat(curPid); $("camTitle").textContent = p.name || "Bệnh nhân mới";
    $("camMsg").textContent = "✓ " + r.x.name + (r.warn ? " · " + r.warn : "");
    if (camRole === "BN"){ camRole = "NN"; setTimeout(paintRole, 1400); }
  } else { cooldownUntil = performance.now() + 600; $("camMsg").textContent = r.msg; }
}
let actx = null;
function beep(){ try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=1200; g.gain.value=0.07; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+0.09); } catch(e){} }
$("camDone").onclick = closeCamera; $("camX").onclick = closeCamera;

/* ================= Xuất file ================= */
let expKind = "VN", expScope = "pending";
function exportList(){
  return S.people.filter(x => x.kind === expKind).filter(x => expScope === "pending" ? !x.exported : (expScope === "staying" ? !x.left : (x.left === today(0))))
    .sort((a,b) => a.pid === b.pid ? (a.role===b.role ? (a.ct||0)-(b.ct||0) : (a.role==="BN"?-1:1)) : String(a.pid).localeCompare(String(b.pid)));
}
function fileName(kind){ const d=new Date(), z=n=>String(n).padStart(2,"0"); return (kind==="VN"?"tblt_vn_import_":"kbtt_nnn_")+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+"_"+z(d.getHours())+z(d.getMinutes())+".xlsx"; }
async function makeFile(list){
  let blob;
  if (expKind === "VN"){
    const prepared = list.map(x => Object.assign({}, x, { note: noteFor(x), room: roomFor(x), leave: x.left || x.leave }));
    const zip = await JSZip.loadAsync(templateBuf); const xml = await zip.file(CAT.mainSheetPath).async("string");
    zip.file(CAT.mainSheetPath, buildSheetXml(xml, prepared, S.settings.keepVN));
    blob = await zip.generateAsync({type:"blob", compression:"DEFLATE", mimeType:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  } else {
    blob = await buildNNN(list.map(x => Object.assign({}, x, { roomOut: roomFor(x), leave: x.left || x.leave })), S.settings.keepNNN);
  }
  return new File([blob], fileName(expKind), {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
function openExport(){
  const list = exportList();
  const bad = list.filter(x => missingOf(x).length);
  let canShare = false;
  try { canShare = !!(navigator.canShare && navigator.canShare({files:[new File([new Blob(["x"])], "a.xlsx", {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})]})); } catch(e){}
  const cnt = (k, sc) => S.people.filter(x => x.kind === k && (sc === "pending" ? !x.exported : !x.left)).length;

    '<div class="seg" id="kSeg"><button type="button" data-k="VN" class="'+(expKind==="VN"?"on":"")+'">Người Việt Nam ('+cnt("VN","pending")+')</button><button type="button" data-k="NNN" class="'+(expKind==="NNN"?"on":"")+'">Nước ngoài ('+cnt("NNN","pending")+')</button></div>'+
    '<div class="seg" id="sSeg" style="margin-top:8px"><button type="button" data-s="pending" class="'+(expScope==="pending"?"on":"")+'">Chưa nộp</button><button type="button" data-s="staying" class="'+(expScope==="staying"?"on":"")+'">Đang ở</button><button type="button" data-s="outToday" class="'+(expScope==="outToday"?"on":"")+'">Về hôm nay</button></div>'+
    '<div class="raw"><b>'+list.length+' người</b> sẽ được ghi vào mẫu '+(expKind==="VN"?"tblt_vn_import.xlsx":"Danh_Sach_Mau_Excel.xlsx (KBTT)")+'.'+
      (bad.length ? '<div class="hint bad">'+bad.length+' người còn thiếu thông tin bắt buộc: '+bad.slice(0,5).map(x=>esc(x.name||"(chưa tên)")).join(", ")+(bad.length>5?"…":"")+'</div>' : '')+
      (list.length ? '<div style="margin-top:6px">'+list.slice(0,8).map(x => esc(x.name)+' <span style="opacity:.7">('+(x.role==="BN"?"BN":"người nhà "+esc((pat(x.pid)||{}).name||""))+')</span>').join("<br>")+(list.length>8?"<br>…":"")+'</div>' : '')+'</div>'+
    '<div class="btns"><button class="btn primary" id="dlBtn" type="button"'+(list.length?'':' disabled')+'>Tải về máy</button>'+(canShare?'<button class="btn" id="shBtn" type="button"'+(list.length?'':' disabled')+'>Gửi qua Zalo, email…</button>':'')+'</div>'+

    sh => {

$("restoreFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!Array.isArray(d.patients)) throw new Error("File không đúng định dạng");
    const ids = new Set(S.patients.map(p=>p.id)); let n = 0;
    d.patients.forEach(p => { if (!ids.has(p.id)){ S.patients.push(p); n++; } });
    const xids = new Set(S.people.map(x=>x.id)); (d.people||[]).forEach(x => { if (!xids.has(x.id)) S.people.push(x); });
    save(); closeSheet(); render(); toast("Đã khôi phục "+n+" hồ sơ");
  } catch(err){ toast("Không khôi phục được: "+(err.message||err), true); }
};

/* ================= Đồng bộ với máy chủ ================= */
let synced = new Map(), lastSync = 0, pushT = 0, pushing = false, pulling = false, online = true;
function setSync(st){ const d = $("syncDot"); if (!d) return; d.dataset.st = st; d.title = {ok:"Đã đồng bộ", pend:"Đang chờ đồng bộ", off:"Mất kết nối, dữ liệu vẫn lưu trên máy"}[st] || ""; }
function schedulePush(){ if (!ME) return; clearTimeout(pushT); setSync("pend"); pushT = setTimeout(push, 700); }
function localRecords(){ const m = new Map(); S.patients.forEach(p => m.set(p.id, {type:"patient", data:p})); S.people.forEach(x => m.set(x.id, {type:"person", data:x})); return m; }
async function apiCall(path, opt){
  const r = await fetch(path, Object.assign({ credentials:"same-origin", headers:{"content-type":"application/json"} }, opt||{}));
  if (r.status === 401 && path !== "/api/login"){ showLogin("Phiên đăng nhập đã hết, hãy đăng nhập lại."); throw new Error("401"); }
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(d.error || ("Lỗi "+r.status));
  return d;
}
async function push(){
  if (pushing || !ME) return; pushing = true;
  try {
    const loc = localRecords(), out = [];
    for (const [id, r] of loc){ const j = JSON.stringify(r.data); if (synced.get(id) !== j) out.push({id, type:r.type, data:r.data, _j:j}); }
    for (const [id] of synced){ if (!loc.has(id)) out.push({id, type: id.startsWith("p") ? "patient" : "person", deleted:true}); }
    for (let i = 0; i < out.length; i += 200){
      const chunk = out.slice(i, i+200);
      await apiCall("/api/sync", {method:"POST", body: JSON.stringify({records: chunk.map(({_j, ...r}) => r)})});
      chunk.forEach(r => r.deleted ? synced.delete(r.id) : synced.set(r.id, r._j));
    }
    online = true; setSync("ok");
    try { localStorage.setItem(cacheKey, JSON.stringify({patients:S.patients, people:S.people, status:S.status, synced:[...synced], lastSync})); } catch(e){}
  } catch(e){ if (e.message !== "401"){ online = false; setSync("off"); setTimeout(schedulePush, 8000); } }
  finally { pushing = false; }
}
async function pull(){
  if (pulling || !ME) return; pulling = true;
  try {
    const d = await apiCall("/api/sync?since="+lastSync);
    let changed = false;
    const loc = localRecords();
    for (const r of d.records){
      if (r.type === "status"){ const k = r.id.slice(1); if (r.deleted) delete S.status[k]; else S.status[k] = r.data; changed = true; continue; }
      const cur = loc.get(r.id);
      const dirty = cur && JSON.stringify(cur.data) !== synced.get(r.id);
      if (dirty) continue;
      const arr = r.type === "patient" ? S.patients : S.people;
      const i = arr.findIndex(o => o.id === r.id);
      if (r.deleted){ if (i >= 0){ arr.splice(i, 1); changed = true; } synced.delete(r.id); continue; }
      const j = JSON.stringify(r.data); synced.set(r.id, j);
      if (i >= 0){ if (JSON.stringify(arr[i]) === j) continue; const o = arr[i]; Object.keys(o).forEach(k => { if (!(k in r.data)) delete o[k]; }); Object.assign(o, r.data); }
      else arr.push(r.data);
      changed = true;
    }
    lastSync = d.now; online = true;
    if (changed){ S.patients.sort((a,b) => (b.ct||0)-(a.ct||0)); try { localStorage.setItem(cacheKey, JSON.stringify({patients:S.patients, people:S.people, status:S.status, synced:[...synced], lastSync})); } catch(e){} if (!$("cam").hidden) {} else render(); }
    setSync(pushing || [...localRecords()].some(([id,r]) => synced.get(id) !== JSON.stringify(r.data)) ? "pend" : "ok");
  } catch(e){ if (e.message !== "401"){ online = false; setSync("off"); } }
  finally { pulling = false; }
}
setInterval(() => { if (ME && !document.hidden){ pull().then(push); } }, 10000);
document.addEventListener("visibilitychange", () => { if (ME && !document.hidden) pull().then(push); });
window.addEventListener("online", () => { if (ME) pull().then(push); });

  ME = user; try { localStorage.setItem(KEY+":lastUser", JSON.stringify(user)); } catch(e){} cacheKey = KEY + ":data:" + user.username;
  S.patients = []; S.people = []; S.status = {}; synced = new Map(); lastSync = 0;
  try { const c = JSON.parse(localStorage.getItem(cacheKey)||"null"); if (c){ S.patients = c.patients||[]; S.people = c.people||[]; S.status = c.status||{}; synced = new Map(c.synced||[]); lastSync = c.lastSync||0; } } catch(e){}
  migrateOld();
  $("auth").hidden = true; $("app").hidden = false;
  render(); await pull(); push();
  apiCall("/api/kbtt/status").then(d => { KB = d; render(); }).catch(()=>{});
}
async function boot(){
  try {
    const st = await (await fetch("/api/status", {credentials:"same-origin"})).json();
    if (st.needsSetup) return showLogin("", true);
    if (!st.user) return showLogin("");
    startApp(st.user);
  } catch(e){
    // không có mạng: mở dữ liệu đã lưu của lần đăng nhập trước
    let last = null; try { last = JSON.parse(localStorage.getItem(KEY+":lastUser")||"null"); } catch(_){}
    if (last){ startApp(last); setSync("off"); toast("Đang offline, dữ liệu sẽ đồng bộ khi có mạng."); }
    else showLogin("Không kết nối được máy chủ. Kiểm tra mạng rồi tải lại trang.");
  }
}

/* ================= Khởi động ================= */
function b64buf(b64){ const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u.buffer; }
(async () => {
  try {
    templateBuf = b64buf(window.__TEMPLATE_B64); await loadTemplate(templateBuf);
    nnnBuf = b64buf(window.__NNN_B64); await loadNNN(nnnBuf);
    boot();
  } catch(e){ $("loading").textContent = "Không đọc được file mẫu: "+(e.message||e); }
})();
if ("serviceWorker" in navigator && location.protocol === "https:") window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
window.__app = { S, onScan, go, CAT, buildNNN };
})();
</script>
